<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pixbeam</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 1rem; }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    p  { color: #666; margin-bottom: 2rem; }
    .cards { display: flex; gap: 1rem; flex-wrap: wrap; }
    .card { flex: 1; min-width: 180px; border: 1px solid #ddd; border-radius: 12px; padding: 1.5rem;
            text-decoration: none; color: inherit; transition: box-shadow .15s; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .card h2 { margin: 0 0 .5rem; font-size: 1.2rem; }
    .card span { font-size: .9rem; color: #888; }
  </style>
</head>
<body>
  <h1>pixbeam</h1>
  <p>Transfer files from laptop to phone using only the screen and camera. No Wi-Fi, no cables.</p>
  <div class="cards">
    <a class="card" href="./sender.html">
      <h2>📤 Sender</h2>
      <span>Run on your laptop — displays a stream of QR codes</span>
    </a>
    <a class="card" href="./receiver.html">
      <h2>📥 Receiver</h2>
      <span>Run on your phone — scans QR codes and saves the file</span>
    </a>
  </div>
</body>
</html>
