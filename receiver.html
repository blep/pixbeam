<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pixbeam — Receiver</title>
  <link rel="stylesheet" href="/src/receiver/style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>pixbeam <span>receiver</span></h1>
    <p>Point your camera at the sender's screen to receive a file.</p>
    <button id="start-btn">Start camera</button>
    <p id="error-msg" hidden></p>
  </div>

  <div id="scan-screen" hidden>
    <video id="preview" autoplay muted playsinline></video>
    <canvas id="scan-canvas" hidden></canvas>
    <!-- Transparent overlay; QR bounding box drawn here each frame -->
    <canvas id="overlay-canvas"></canvas>

    <div id="status-bar">
      <!-- Always-visible counters: confirm camera + protocol are working -->
      <div id="counters">
        <span class="counter">
          <span class="counter-label">QR detected</span>
          <span class="counter-value" id="cnt-detected">0</span>
        </span>
        <span class="counter-sep">·</span>
        <span class="counter">
          <span class="counter-label">pixbeam packets</span>
          <span class="counter-value" id="cnt-valid">0</span>
        </span>
      </div>

      <span id="status-text"></span>
      <div id="progress-bars"></div>
    </div>

    <button id="cancel-btn">Cancel</button>
  </div>

  <div id="done-screen" hidden>
    <h2>✅ Transfer complete</h2>
    <p id="done-info"></p>
    <a id="download-link" download>Download file</a>
    <button id="restart-btn">Receive another</button>
  </div>

  <script type="module" src="/src/receiver/main.ts"></script>
</body>
</html>
