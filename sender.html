<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pixbeam — Sender</title>
  <link rel="stylesheet" href="/src/sender/style.css" />
</head>
<body>
  <!--
    Layout: QR square always gets the largest possible region.
    Landscape → panel on left, QR on right (full height).
    Portrait  → panel on top, QR below (full width).
  -->
  <div id="panel">
    <h1>pixbeam <span>sender</span></h1>

    <div id="pick-ui">
      <label id="drop-zone">
        <input type="file" id="file-input" />
        <span id="drop-label">Drop a file here<br>or click to choose</span>
      </label>
      <p id="error-msg" hidden></p>
    </div>

    <div id="send-ui" hidden>
      <p id="send-filename"></p>
      <dl id="stats">
        <dt>Frames</dt><dd id="stat-frame">—</dd>
        <dt>FPS</dt>   <dd id="stat-fps">—</dd>
        <dt>Blocks</dt><dd id="stat-block">—</dd>
      </dl>
      <div id="fps-control">
        <label for="fps-slider">
          Speed: <strong id="fps-label">12</strong> fps
        </label>
        <input id="fps-slider" type="range" min="1" max="60" value="12" step="1" />
      </div>
      <button id="stop-btn">✕ Stop</button>
    </div>
  </div>

  <div id="qr-area">
    <canvas id="qr-canvas"></canvas>
    <p id="qr-hint">waiting for file…</p>
  </div>

  <script type="module" src="/src/sender/main.ts"></script>
</body>
</html>
